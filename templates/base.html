<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}拓界 · 每日知识漫游{% endblock %}</title>
<link rel="alternate" type="application/rss+xml" title="拓界 RSS" href="{{ feed_href }}">
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body { margin: 0; font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
       background: #faf8f4; color: #2b2b2b; line-height: 1.7; }
.wrap { max-width: 860px; margin: 0 auto; padding: 24px 16px 48px; }
header.site { display: flex; align-items: baseline; gap: 12px; border-bottom: 2px solid #d9d2c5;
              padding-bottom: 12px; margin-bottom: 24px; }
header.site h1 { font-size: 1.5rem; margin: 0; }
header.site .tagline { color: #8a8375; font-size: .9rem; }
nav.site { margin-left: auto; font-size: .9rem; }
nav.site a { color: #6b5d3f; text-decoration: none; margin-left: 12px; }
.card { background: #fff; border: 1px solid #e5dfd3; border-radius: 10px;
        padding: 20px 22px; margin-bottom: 22px; }
.card h2 { margin: 0 0 4px; font-size: 1.25rem; }
.card h2 a { color: #2b2b2b; text-decoration: none; }
.domain-tag { display: inline-block; background: #efe8da; color: #6b5d3f; border-radius: 4px;
              padding: 1px 8px; font-size: .78rem; margin-left: 8px; vertical-align: middle; }
.zh-title { color: #8a8375; font-size: .9rem; margin: 0 0 8px; }
.brief { margin: 8px 0 14px; }
.zh-absent { color: #b08a3e; font-size: .82rem; }
ul.items { list-style: none; margin: 0; padding: 0; }
ul.items li { padding: 7px 0; border-top: 1px dashed #e5dfd3; }
ul.items a { color: #34558b; text-decoration: none; }
.badge { display: inline-block; border-radius: 4px; padding: 0 6px; font-size: .74rem;
         margin-right: 6px; color: #fff; }
.badge.article { background: #64748b; }
.badge.video { background: #b91c1c; }
.badge.paper { background: #15803d; }
.badge.discussion { background: #a16207; }
.badge.wechat { background: #07843d; }
.reason { color: #8a8375; font-size: .8rem; margin-left: 6px; }
.few { color: #b08a3e; font-size: .85rem; }
footer.site { color: #8a8375; font-size: .82rem; border-top: 1px solid #e5dfd3;
              margin-top: 28px; padding-top: 12px; }
.archive-month h2 { font-size: 1.1rem; }
.archive-month ul { list-style: none; padding: 0; }
.archive-month li { padding: 4px 0; }
.archive-month a { color: #34558b; text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
<header class="site">
  <h1>拓界</h1>
  <span class="tagline">每天 3 个词条，走出信息茧房</span>
  <nav class="site"><a href="{{ archive_href }}">归档</a><a href="{{ feed_href }}">RSS</a></nav>
</header>
{% block content %}{% endblock %}
<footer class="site">
  <p>本期信源：{{ sources_ok }}/{{ sources_total }} 可用 · 生成于 {{ generated_at }}</p>
  <p>内容来自维基百科及全网公开信源，仅供知识漫游；无追踪、无推荐算法。</p>
</footer>
</div>
</body>
</html>
